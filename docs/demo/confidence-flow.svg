<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="GitHub PR vs Issue confidence gate">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#0D1117"/>

  <rect width="1440" height="56" fill="#010409" stroke="#21262D" stroke-width="1"/>
  <circle cx="40" cy="28" r="12" fill="#EDE7D9" fill-opacity="0.85"/>
  <text x="64" y="33" font-family="Inter" font-weight="500" font-size="14" fill="#EDE7D9">patchhq / checkout-app</text>
  <text x="1240" y="33" font-family="JetBrains Mono" font-weight="500" font-size="12" fill="#EDE7D9" fill-opacity="0.45">patch scan - just now</text>

  <text x="48" y="110" font-family="Inter" font-size="14" fill="#EDE7D9" fill-opacity="0.55">Actions / patch</text>
  <text x="48" y="150" font-family="JetBrains Mono" font-style="italic" font-weight="800" font-size="28" fill="#EDE7D9">Confidence gate</text>
  <text x="48" y="180" font-family="Inter" font-size="15" fill="#EDE7D9" fill-opacity="0.5">Same scan. Threshold decides whether Patch opens a PR or an Issue.</text>

  <rect x="48" y="210" width="320" height="36" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="68" y="233" font-family="JetBrains Mono" font-weight="500" font-size="13" fill="#EDE7D9" fill-opacity="0.7">confidence_threshold = <tspan fill="#C6890F">0.7</tspan></text>

  <g filter="url(#cardShadow)">
    <rect x="48" y="280" width="640" height="520" rx="10" fill="#161B22" stroke="#238636" stroke-width="1.5"/>
    <rect x="48" y="280" width="640" height="56" rx="10" fill="#12261A"/>
    <rect x="48" y="320" width="640" height="16" fill="#12261A"/>

    <circle cx="88" cy="308" r="12" fill="none" stroke="#3FB950" stroke-width="2"/>
    <path d="M82 308 h12 M88 302 v12" stroke="#3FB950" stroke-width="2" stroke-linecap="round"/>

    <text x="112" y="314" font-family="Inter" font-weight="500" font-size="15" fill="#3FB950">Open</text>
    <text x="168" y="314" font-family="Inter" font-size="15" fill="#EDE7D9" fill-opacity="0.45">Pull request</text>

    <text x="80" y="380" font-family="Inter" font-weight="500" font-size="22" fill="#EDE7D9">fix: require currency on createCharge</text>
    <text x="80" y="412" font-family="JetBrains Mono" font-weight="500" font-size="13" fill="#EDE7D9" fill-opacity="0.45">patch/a1b2c3d4 into main</text>

    <rect x="80" y="440" width="100" height="28" rx="14" fill="#1F6FEB" fill-opacity="0.2" stroke="#1F6FEB" stroke-opacity="0.5"/>
    <text x="96" y="459" font-family="JetBrains Mono" font-weight="500" font-size="12" fill="#58A6FF">+4 -0</text>

    <rect x="198" y="440" width="160" height="28" rx="14" fill="#C6890F" fill-opacity="0.15" stroke="#C6890F" stroke-opacity="0.5"/>
    <text x="214" y="459" font-family="JetBrains Mono" font-weight="500" font-size="12" fill="#C6890F">confidence 0.85</text>

    <text x="80" y="520" font-family="Inter" font-size="14" fill="#EDE7D9" fill-opacity="0.55">Checks</text>
    <path d="M80 548 l5 5 l10 -12" fill="none" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="556" font-family="JetBrains Mono" font-weight="500" font-size="14" fill="#3FB950">typecheck</text>
    <path d="M80 578 l5 5 l10 -12" fill="none" stroke="#3FB950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="102" y="586" font-family="JetBrains Mono" font-weight="500" font-size="14" fill="#3FB950">tsc passed on 4 sites</text>

    <text x="80" y="650" font-family="Inter" font-size="14" fill="#EDE7D9" fill-opacity="0.45">Opened because average confidence</text>
    <text x="80" y="678" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#C6890F">0.85 &gt;= 0.7</text>

    <rect x="80" y="720" width="200" height="40" rx="6" fill="#238636"/>
    <text x="180" y="745" text-anchor="middle" font-family="Inter" font-weight="500" font-size="14" fill="#FFFFFF">Merge pull request</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="752" y="280" width="640" height="520" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="752" y="280" width="640" height="56" rx="10" fill="#1C1210"/>
    <rect x="752" y="320" width="640" height="16" fill="#1C1210"/>

    <circle cx="792" cy="308" r="12" fill="none" stroke="#C6890F" stroke-width="2"/>
    <circle cx="792" cy="303" r="1.6" fill="#C6890F"/>
    <line x1="792" y1="308" x2="792" y2="316" stroke="#C6890F" stroke-width="2" stroke-linecap="round"/>

    <text x="816" y="314" font-family="Inter" font-weight="500" font-size="15" fill="#C6890F">Open</text>
    <text x="872" y="314" font-family="Inter" font-size="15" fill="#EDE7D9" fill-opacity="0.45">Issue</text>

    <text x="784" y="380" font-family="Inter" font-weight="500" font-size="22" fill="#EDE7D9">upstream: currency now required</text>
    <text x="784" y="412" font-family="JetBrains Mono" font-weight="500" font-size="13" fill="#EDE7D9" fill-opacity="0.45">needs review - heuristic path</text>

    <rect x="784" y="440" width="160" height="28" rx="14" fill="#C6890F" fill-opacity="0.12" stroke="#C6890F" stroke-opacity="0.4"/>
    <text x="800" y="459" font-family="JetBrains Mono" font-weight="500" font-size="12" fill="#C6890F">confidence 0.55</text>

    <text x="784" y="520" font-family="Inter" font-size="14" fill="#EDE7D9" fill-opacity="0.55">Diagnosis</text>
    <text x="784" y="556" font-family="JetBrains Mono" font-weight="500" font-size="14" fill="#EDE7D9" fill-opacity="0.75">4 createCharge sites found</text>
    <text x="784" y="586" font-family="JetBrains Mono" font-weight="500" font-size="14" fill="#EDE7D9" fill-opacity="0.75">fix proposed, below PR threshold</text>

    <text x="784" y="650" font-family="Inter" font-size="14" fill="#EDE7D9" fill-opacity="0.45">Opened because average confidence</text>
    <text x="784" y="678" font-family="JetBrains Mono" font-weight="500" font-size="16" fill="#EDE7D9" fill-opacity="0.7">0.55 &lt; 0.7</text>

    <rect x="784" y="720" width="160" height="40" rx="6" fill="#21262D" stroke="#30363D"/>
    <text x="864" y="745" text-anchor="middle" font-family="Inter" font-weight="500" font-size="14" fill="#EDE7D9">View report</text>
  </g>
</svg>
