<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">npx patch init detecting APIs</title>
  <desc id="desc">Terminal screenshot of Patch init auto-detecting TypeScript and API connectors</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a100e"/>
      <stop offset="55%" stop-color="#0c1210"/>
      <stop offset="100%" stop-color="#101814"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="280" fill="#e8a54b" opacity="0.08"/>
  <circle cx="1100" cy="620" r="260" fill="#5ecf9a" opacity="0.07"/>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="120" y="90" width="1040" height="540" rx="16" fill="#0a0f0d" stroke="#1e2a24"/>
    <rect x="120" y="90" width="1040" height="48" rx="16" fill="#141c18"/>
    <rect x="120" y="122" width="1040" height="16" fill="#141c18"/>
    <circle cx="152" cy="114" r="6" fill="#e07060"/>
    <circle cx="174" cy="114" r="6" fill="#e8a54b"/>
    <circle cx="196" cy="114" r="6" fill="#5ecf9a"/>
    <text x="230" y="119" fill="#8fa397" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">zsh  patch init</text>
    <text x="1040" y="119" fill="#e8a54b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="end">@patch-dev/cli</text>

    <!-- Terminal body -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="156" y="180" fill="#8fa397">$ npx patch init</text>

      <text x="156" y="222" fill="#e8f0ea" font-style="italic" font-weight="700" font-size="22">Patch init</text>
      <text x="156" y="248" fill="#8fa397">----------</text>

      <text x="156" y="292" fill="#e8f0ea">Detected languages: </text>
      <text x="378" y="292" fill="#5ecf9a">TypeScript</text>

      <text x="156" y="336" fill="#e8f0ea">Detected </text>
      <text x="256" y="336" fill="#e8a54b">2</text>
      <text x="276" y="336" fill="#e8f0ea"> connector match(es):</text>

      <text x="176" y="380" fill="#5ecf9a">"</text>
      <text x="200" y="380" fill="#e8f0ea">stripe</text>
      <text x="290" y="380" fill="#8fa397">’</text>
      <text x="320" y="380" fill="#e8a54b">stripe-openapi</text>
      <text x="500" y="380" fill="#8fa397">(openapi-diff)</text>

      <text x="176" y="416" fill="#5ecf9a">"</text>
      <text x="200" y="416" fill="#e8f0ea">openai</text>
      <text x="290" y="416" fill="#8fa397">’</text>
      <text x="320" y="416" fill="#e8a54b">openai-node-sdk</text>
      <text x="520" y="416" fill="#8fa397">(package-diff)</text>

      <text x="156" y="468" fill="#e8f0ea">Wrote </text>
      <text x="226" y="468" fill="#5ecf9a">patch.config.json</text>
      <text x="156" y="500" fill="#e8f0ea">Wrote </text>
      <text x="226" y="500" fill="#5ecf9a">.patch/rules.md</text>
      <text x="156" y="532" fill="#e8f0ea">Scaffolded </text>
      <text x="286" y="532" fill="#5ecf9a">.github/workflows/patch.yml</text>

      <text x="156" y="580" fill="#8fa397">Model provider: anthropic · APIs detected automatically</text>
      <rect x="156" y="598" width="10" height="18" fill="#5ecf9a">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <text x="640" y="680" fill="#8fa397" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">
    patch init scans package.json and wires connectors for you
  </text>
</svg>
