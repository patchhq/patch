<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Real terminal: npx patch init">
  <rect width="1440" height="900" fill="#0D0B09"/>
  <rect width="1440" height="900" fill="#17130E" opacity="0.92"/>

  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A241C"/>
      <stop offset="100%" stop-color="#1F1A14"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="70" width="1240" height="760" rx="12" fill="#17130E" stroke="#3A3228" stroke-width="1"/>
    <rect x="100" y="70" width="1240" height="44" rx="12" fill="url(#titlebar)"/>
    <rect x="100" y="102" width="1240" height="12" fill="#1F1A14"/>

    <circle cx="128" cy="92" r="7" fill="#FF5F57"/>
    <circle cx="152" cy="92" r="7" fill="#FEBC2E"/>
    <circle cx="176" cy="92" r="7" fill="#28C840"/>

    <text x="720" y="97" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="13" fill="#EDE7D9" fill-opacity="0.55">HP@patch - zsh - 120x36</text>

    <rect x="100" y="114" width="1240" height="716" fill="#17130E"/>

    <g font-family="JetBrains Mono" font-weight="500" font-size="18" fill="#EDE7D9">
      <text x="128" y="160"><tspan fill="#C6890F">patch</tspan><tspan fill="#EDE7D9" fill-opacity="0.45"> on </tspan><tspan fill="#C6890F">main</tspan><tspan fill="#EDE7D9" fill-opacity="0.45"> via </tspan><tspan fill="#C6890F">v20.11.0</tspan></text>
      <text x="128" y="190"><tspan fill="#C6890F">&gt;</tspan> npx patch init</text>

      <text x="128" y="240" fill="#EDE7D9" fill-opacity="0.4">Need to install the following packages:</text>
      <text x="128" y="266" fill="#EDE7D9" fill-opacity="0.4">  @patch-dev/cli@0.1.4</text>
      <text x="128" y="292" fill="#EDE7D9" fill-opacity="0.4">Ok to proceed? (y) y</text>

      <text x="128" y="346" font-style="italic" font-weight="800" font-size="22" fill="#EDE7D9">Patch init</text>
      <text x="128" y="372" fill="#EDE7D9" fill-opacity="0.35">----------</text>

      <text x="128" y="418">Detected languages: <tspan fill="#C6890F">TypeScript</tspan></text>
      <text x="128" y="456">Detected 2 connector match(es):</text>

      <text x="128" y="500"><tspan fill="#C6890F">  *</tspan> openai <tspan fill="#EDE7D9" fill-opacity="0.4">-&gt;</tspan> openai-node-sdk <tspan fill="#EDE7D9" fill-opacity="0.45">(package-diff)</tspan></text>
      <text x="128" y="532"><tspan fill="#C6890F">  *</tspan> stripe <tspan fill="#EDE7D9" fill-opacity="0.4">-&gt;</tspan> stripe-openapi <tspan fill="#EDE7D9" fill-opacity="0.45">(openapi-diff)</tspan></text>

      <text x="128" y="580" fill="#EDE7D9" fill-opacity="0.7">Write patch.config.json with these connectors? [Y/n] Y</text>

      <text x="128" y="624">Wrote <tspan fill="#C6890F">patch.config.json</tspan></text>
      <text x="128" y="656">Model provider: anthropic (key from $ANTHROPIC_API_KEY)</text>
      <text x="128" y="688">Wrote <tspan fill="#C6890F">.patch/rules.md</tspan></text>
      <text x="128" y="720">Scaffolded <tspan fill="#C6890F">.github/workflows/patch.yml</tspan></text>

      <text x="128" y="768" fill="#EDE7D9" fill-opacity="0.55">Next steps:</text>
      <text x="128" y="800" fill="#EDE7D9" fill-opacity="0.55">  1. Install the Patch GitHub App on this repo</text>
      <text x="128" y="832" fill="#EDE7D9" fill-opacity="0.55">  2. Add secrets: ANTHROPIC_API_KEY, PATCH_GITHUB_APP_ID, ...</text>
    </g>

    <rect x="128" y="852" width="9" height="18" fill="#C6890F" opacity="0.85"/>
  </g>
</svg>
